<style>
/* Layout: a quiet studio desk. Top bar with four views; the editor is form on the left, a live A4 sheet on the right. */
:root{
  --paper:#F3F2EF; --stone:#E4E2DD; --hairline:#C9C7C2; --ink:#141516; --ink-muted:#5E6062;
  --sindoor:#A3261F; --on-sindoor:#FFFFFF; --surface:#FFFFFF; --field:#FFFFFF;
  --good:#1F6B45; --good-bg:#DCEBE2; --warn:#7A5A0B; --warn-bg:#F1E6C8; --bad:#A3261F; --bad-bg:#F3DCDA; --idle-bg:#E4E2DD;
  --logo-filter:none;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:var(--sheet);
  --sheet:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121314; --stone:#222426; --hairline:#3A3C3F; --ink:#EEEDEA; --ink-muted:#A3A5A7;
  --sindoor:#E0574C; --on-sindoor:#121314; --surface:#1A1B1D; --field:#121314;
  --good:#7FD3A4; --good-bg:#16302A; --warn:#E6C46A; --warn-bg:#352C14; --bad:#F08A80; --bad-bg:#3A1C1A; --idle-bg:#2A2C2F;
  --logo-filter:invert(1); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121314; --stone:#222426; --hairline:#3A3C3F; --ink:#EEEDEA; --ink-muted:#A3A5A7;
  --sindoor:#E0574C; --on-sindoor:#121314; --surface:#1A1B1D; --field:#121314;
  --good:#7FD3A4; --good-bg:#16302A; --warn:#E6C46A; --warn-bg:#352C14; --bad:#F08A80; --bad-bg:#3A1C1A; --idle-bg:#2A2C2F;
  --logo-filter:invert(1); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sindoor);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:46px;width:auto;filter:var(--logo-filter)}
.brand span{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--ink-muted);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px}
nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav a.cta{color:var(--on-sindoor);background:var(--sindoor)}
nav a:hover:not([aria-current="page"]){color:var(--ink)}

.view{padding-block:28px;display:flex;flex-direction:column;gap:24px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:600;margin:0}
.label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}
.banner{padding:12px 16px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.accent{background:var(--sindoor);color:var(--on-sindoor);border-color:var(--sindoor)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted);padding-inline:10px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:12px;padding:6px 12px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--hairline);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.tile small{color:var(--ink-muted);font-size:12px}
.tile.alert b{color:var(--sindoor)}

/* list */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--stone);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:12px;color:var(--ink-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--hairline);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:120px minmax(0,1.4fr) 110px 110px 96px 230px;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--hairline)}
.row:first-child{border-top:0}
.row.head{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);padding-block:10px;background:var(--paper)}
.row .who{min-width:0}
.row .who strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span{display:block;font-size:12px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;font-weight:600}
.row .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;justify-self:start}
.chip.paid{background:var(--good-bg);color:var(--good)}
.chip.sent{background:var(--idle-bg);color:var(--ink)}
.chip.overdue{background:var(--bad-bg);color:var(--bad)}
.chip.part{background:var(--warn-bg);color:var(--warn)}
.chip.draft{background:transparent;color:var(--ink-muted);border:1px dashed var(--hairline)}
.paybox{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--paper);border-radius:6px;padding:14px}
.paybox .hint{flex-basis:100%;font-size:12px;color:var(--ink-muted)}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:46ch;color:var(--ink-muted)}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .row.head{display:none}
  .row .no{grid-column:1}.row .chip{grid-column:2;justify-self:end;grid-row:1}
  .row .who{grid-column:1/-1}.row .date{grid-column:1}.row .amt{grid-column:2}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:600;color:var(--ink-muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--field);border:1px solid var(--hairline);border-radius:6px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:hover,select:hover,textarea:hover{border-color:var(--ink-muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;background:var(--stone);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--hairline);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
.quick button:hover{border-style:solid;border-color:var(--ink)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 110px 32px;gap:8px;align-items:start}
.item textarea{min-height:40px;height:40px}
.item .x{border:0;background:transparent;color:var(--ink-muted);cursor:pointer;font-size:18px;line-height:1;padding:9px 0}
.item .x:hover{color:var(--sindoor)}
.items-head{display:grid;grid-template-columns:minmax(0,1fr) 64px 110px 32px;gap:8px;font-size:11px;color:var(--ink-muted);font-weight:600}
@media (max-width:520px){.item,.items-head{grid-template-columns:minmax(0,1fr) 56px 92px 28px}}
.totals-mini{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--hairline);padding-top:10px}
.totals-mini b{font-size:15px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.checks .ok::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:6px}
.checks .no::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sindoor);margin-top:6px}

/* editor layout */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.form-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.preview-col{position:sticky;top:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.sheet-wrap{width:100%;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08)}
@media (max-width:980px){.editor{grid-template-columns:1fr}.preview-col{position:static}}

/* the A4 sheet (always white paper) */
.sheet{width:794px;height:1123px;background:#fff;color:#141516;font-family:var(--sheet);transform-origin:top left;position:relative;padding:68px 68px 0}
.sheet .s-top{display:flex;justify-content:space-between;align-items:flex-start}
.sheet .s-logo{width:174px;height:auto}
.sheet .s-title{text-align:right}
.sheet .s-title h3{margin:0;font-size:30px;font-weight:700;color:#A3261F;letter-spacing:.02em}
.sheet .s-title p{margin:6px 0 0;font-size:14px;font-weight:600}
.sheet .s-meta{display:flex;justify-content:space-between;margin-top:30px;font-size:12px;line-height:1.65}
.sheet .s-from b{font-weight:700}
.sheet .s-from .m{color:#5E6062}
.sheet .s-dates{display:grid;grid-template-columns:auto auto;gap:0 22px;text-align:right}
.sheet .s-dates span{color:#5E6062}
.sheet .s-dates strong{font-weight:700}
.sheet .s-parties{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;margin-top:28px;padding-top:16px;border-top:1px solid #C9C7C2;font-size:12px;line-height:1.6}
.sheet .s-lab{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:#5E6062;text-transform:uppercase;margin-bottom:4px}
.sheet .s-parties strong{font-size:14px;font-weight:700;display:block}
.sheet .s-parties .m{color:#5E6062}
.sheet table{width:100%;border-collapse:collapse;margin-top:30px;font-size:12px}
.sheet thead tr{background:#141516}
.sheet th{background:transparent;color:#fff;font-weight:700;text-align:left;padding:9px 12px;font-size:11px}
.sheet th.r,.sheet td.r{text-align:right}
.sheet td{padding:10px 12px;border-bottom:1px solid #E4E2DD;vertical-align:top}
.sheet .s-bottom{display:flex;justify-content:space-between;gap:30px;margin-top:18px}
.sheet .s-note{font-size:11px;color:#5E6062;max-width:300px;line-height:1.5;padding-top:6px}
.sheet .s-tot{width:300px;font-size:12px}
.sheet .s-tot div{display:flex;justify-content:space-between;padding:5px 12px}
.sheet .s-tot .strong{font-weight:700;font-size:13px}
.sheet .s-tot .bal{background:#E4E2DD;font-weight:700;font-size:15px;margin-top:6px;padding:10px 12px}
.sheet .s-tot .bal span:last-child{color:#A3261F}
.sheet .s-pay{margin-top:34px;background:#F3F2EF;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;font-size:12px;line-height:1.7}
.sheet .s-pay .s-lab{grid-column:1/-1;margin-bottom:6px}
.sheet .s-pay span{color:#5E6062}
.sheet .s-pay div{display:flex;justify-content:space-between;gap:12px}
.sheet .s-pay strong{font-weight:700}
.sheet .s-terms{margin-top:22px;font-size:11px;color:#5E6062;line-height:1.6;white-space:pre-wrap}
.sheet .s-foot{position:absolute;left:68px;right:68px;bottom:44px;border-top:1px solid #C9C7C2;padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:#5E6062}
.sheet .s-foot i{font-family:var(--sheet);font-style:normal;font-weight:700;font-size:11px;color:#141516}

/* sticky actions */
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hairline);z-index:20;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.actionbar .grp{display:flex;gap:8px;flex-wrap:wrap}
.status-pill{font-size:12px;color:var(--ink-muted)}

/* clients & business */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column}
.citem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hairline)}
.citem:first-child{border-top:0}
.citem div{min-width:0}
.citem strong{display:block}
.citem span{font-size:12px;color:var(--ink-muted)}
.rem .late{color:var(--bad)}
.rem b{font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px 32px;gap:8px;align-items:center}
@media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr) 84px 32px}.prow select{grid-column:1/3}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.signed-out .top nav,.signed-out #who{display:none}
#who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-muted);width:100%;justify-content:flex-end;margin-top:-8px}
.login-card{max-width:440px;margin:48px auto 0;width:100%}
.login-card form{display:flex;flex-direction:column;gap:14px}
.login-card .btn{justify-content:center}
.mlist .citem span{font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const tableCache={};const tableSubs={};
async function fetchTable(t){const {data,error}=await supa.from(t).select("id,data,updated_by,updated_at");if(error)throw error;tableCache[t]=data||[];return tableCache[t]}
function notify(t){(tableSubs[t]||[]).forEach(fn=>{try{fn()}catch(e){console.error(e)}})}

function snapDoc(row){return{id:row.id,exists:true,data:()=>({...row.data}),metadata:{fromCache:false}}}
function makeRef(t,id){return{
  id,
  async get(){const {data,error}=await supa.from(t).select("id,data").eq("id",id).maybeSingle();if(error)throw sbErr(error);
    return data?snapDoc(data):{id,exists:false,data:()=>undefined,metadata:{fromCache:false}}},
  async set(obj){const {error}=await supa.from(t).upsert({id,data:obj});if(error)throw sbErr(error);scheduleRefetch(t)},
  async update(patch){const cur=await this.get();if(!cur.exists){const e=new Error("not found");e.code="not_found";throw e}
    const {error}=await supa.from(t).update({data:{...cur.data(),...patch}}).eq("id",id);if(error)throw sbErr(error);scheduleRefetch(t)},
  async delete(){const {error}=await supa.from(t).delete().eq("id",id);if(error)throw sbErr(error);scheduleRefetch(t)},
  onSnapshot(fn,onErr){const run=()=>{const row=(tableCache[t]||[]).find(r=>r.id===id);fn(row?snapDoc(row):{id,exists:false,data:()=>undefined,metadata:{fromCache:false}})};
    (tableSubs[t]=tableSubs[t]||[]).push(run);fetchTable(t).then(run).catch(e=>onErr&&onErr(sbErr(e)))}
}}

/* ---------- money maths ---------- */
function isTaxable(inv,s){
  if(!s.gstRegistered||!s.gstStart)return false;
  const d=inv.eventDate||inv.issueDate||todayISO();
  return d>=s.gstStart;
}
function calc(inv,s){
  const lines=(inv.items||[]).filter(i=>(i.desc||"").trim()||+i.price);
  const sum=r2(lines.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0));
  const tax=isTaxable(inv,s);
  let subtotal,gst,total;
  if(!tax){subtotal=sum;gst=0;total=sum}
  else if(inv.gstMode==="excl"){subtotal=sum;gst=r2(sum*0.1);total=r2(sum+gst)}
  else {total=sum;gst=r2(sum/11);subtotal=r2(total-gst)}
  const deposit=r2(inv.deposit||0), paid=r2(inv.paidAmount||0);
  const balance=r2(total-deposit);
  const owing=r2(Math.max(0,balance-paid));
  return {lines,sum,subtotal,gst,total,deposit,balance,owing,tax};
}
function statusOf(inv){
  if(inv.status==="draft")return "draft";
  const c=calc(inv,state.settings);
  if(c.owing<=0.004&&inv.status!=="draft")return "paid";
  if(+inv.paidAmount>0)return "part";
  if(inv.dueDate&&inv.dueDate<todayISO())return "overdue";
  return "sent";
}
const STATUS_TEXT={draft:"Draft",sent:"Unpaid",overdue:"Overdue",part:"Part paid",paid:"Paid"};
function reserveFor(amount,inv){
  const c=calc(inv,state.settings);const s=state.settings;
  const gstPart=c.total>0?amount*c.gst/c.total:0;
  const ex=amount-gstPart;
  return Math.round(gstPart+ex*(1-(+s.costPct||0))*(+s.taxRate||0));
}
function nextNumber(){
  const p=state.settings.prefix||"KV-";
  let max=0;
  state.invoices.forEach(i=>{if((i.number||"").startsWith(p)){const n=parseInt(i.number.slice(p.length),10);if(n>max)max=n}});
  return p+String(max+1).padStart(3,"0");
}

function reminderMsg(i){

  const nm=(i.client?.name||"").trim(),first=!nm||/^the\s/i.test(nm)||i.client?.business?"there":nm.split(/\s+/)[0];

}

function refreshPreview(){
  const d=state.draft,c=calc(d,state.settings);
  $("#sheetWrap").innerHTML=sheetHTML(d);fitSheet();
  const mt=$("#miniTot");
  if(mt)mt.innerHTML=(c.tax?(d.gstMode==="excl"?`<span>Subtotal ${money(c.subtotal)}</span><span>GST ${money(c.gst)}</span>`:`<span>Includes GST ${money(c.gst)}</span>`):`<span>No GST</span>`)+`<span>Total <b>${money(c.total)}</b></span><span>Balance due <b>${money(c.owing)}</b></span>`;
  const s=state.settings;const ch=[];
  ch.push([!!(d.client.name||"").trim(),"Client name added"]);
  ch.push([c.lines.length>0&&c.total>0,"At least one item with a price"]);
  ch.push([!!(s.bsb&&s.accountNumber),"Bank details set (Business tab)"]);
  if(c.total>=1000)ch.push([!!(d.client.name||"").trim(),"Over $1,000: client name shown (ATO rule)"]);
  ch.push([!d.dueDate||!d.issueDate||d.dueDate>=d.issueDate,"Due date is on or after the issue date"]);
  ch.push([true,c.tax?"Tax invoice: GST "+money(c.gst)+" included":"No GST on this invoice"]);
  $("#checks").innerHTML=ch.map(([ok,t])=>`<div class="${ok?"ok":"no"}">${esc(t)}</div>`).join("");
}
function touch(){state.dirty=true;const p=document.querySelector(".status-pill");if(p)p.textContent="Unsaved changes";refreshPreview()}
function wireEditor(){
  const d=state.draft,s=state.settings;
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener("input",()=>{fn(el.value);touch()})};
  bind("cName",v=>d.client.name=v);bind("cEmail",v=>d.client.email=v);bind("cBiz",v=>d.client.business=v);bind("cAbn",v=>d.client.abn=v);
  bind("ev",v=>d.event=v);bind("evDate",v=>{d.eventDate=v});bind("isDate",v=>d.issueDate=v);bind("duDate",v=>d.dueDate=v);
  bind("dep",v=>d.deposit=+v||0);bind("note",v=>d.note=v);
  $("#evDate").addEventListener("change",()=>renderEditor());
  $("#cName").addEventListener("input",()=>{const r=document.getElementById("saveClientRow");if(r)r.style.display=d.client.name.trim()?"flex":"none"});
  $("#clientPick").onchange=e=>{const cl=state.clients.find(x=>x.id===e.target.value);
    if(cl){d.clientId=cl.id;d.client={name:cl.name||"",business:cl.business||"",abn:cl.abn||"",email:cl.email||""};
      const hasPrices=d.items.some(i=>+i.price);if(!hasPrices)d.gstMode=cl.mode||"incl";
      if(cl.mode==="excl"&&(d.note===s.notePrivate||!d.note))d.note=s.noteBusiness;}
    else{d.clientId="";}
    state.dirty=true;renderEditor()};
  const cc=$("#clearClient");if(cc)cc.onclick=()=>{d.clientId="";d.client={name:"",business:"",abn:"",email:""};state.dirty=true;renderEditor()};
  document.querySelectorAll("[data-due]").forEach(b=>b.onclick=()=>{const v=b.dataset.due;
    d.dueDate=v==="ev7"?addDays(d.eventDate,-7):v==="ev14"?addDays(d.eventDate,-14):addDays(d.issueDate,+v);
    if(d.dueDate<d.issueDate)d.dueDate=d.issueDate;$("#duDate").value=d.dueDate;touch()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{d.gstMode=b.dataset.mode;state.dirty=true;renderEditor()});
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{const p=s.priceList[+b.dataset.preset];
    const filled=d.items.filter(i=>(i.desc||"").trim()||+i.price);
    let price=+p.price;const pm=p.mode||"incl";
    if(!filled.length)d.gstMode=pm;else if(pm!==d.gstMode)price=pm==="incl"?r2(price/1.1):r2(price*1.1);
    const it={desc:p.desc||p.name,qty:1,price};
    const blank=d.items.findIndex(i=>!(i.desc||"").trim()&&!+i.price);
    if(blank>=0)d.items[blank]=it;else d.items.push(it);
    state.dirty=true;renderEditor()});
  document.querySelectorAll("[data-i]").forEach(el=>el.addEventListener("input",()=>{const it=d.items[+el.dataset.i];const k=el.dataset.k;it[k]=k==="desc"?el.value:(el.value===""?"":+el.value);touch()}));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{d.items.splice(+b.dataset.del,1);if(!d.items.length)d.items.push(blankItem());state.dirty=true;renderEditor()});
  $("#addItem").onclick=()=>{d.items.push(blankItem());state.dirty=true;renderEditor();const last=document.getElementById("d"+(d.items.length-1));if(last)last.focus()};
  $("#dep30").onclick=()=>{d.deposit=Math.round(calc({...d,deposit:0},s).total*0.3);$("#dep").value=d.deposit;touch()};
  $("#dep0").onclick=()=>{d.deposit=0;$("#dep").value="";touch()};
  document.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{const k=b.dataset.note;d.note=k==="private"?s.notePrivate:k==="business"?s.noteBusiness:"";$("#note").value=d.note;touch()});
  $("#saveBtn").onclick=()=>saveDraft(true);
  $("#pdfBtn").onclick=e=>downloadInvoice(state.draft,e.currentTarget,true);
  const dup=$("#dupBtn");if(dup)dup.onclick=()=>{const c=JSON.parse(JSON.stringify(d));Object.assign(c,{_new:true,createdBy:"",updatedBy:"",paidBy:"",remindedAt:"",remindCount:0,number:nextNumber(),status:"draft",issueDate:todayISO(),dueDate:addDays(todayISO(),s.termsDays),paidAmount:0,paidDate:"",deposit:0});state.draft=c;state.dirty=true;renderEditor();toast("Copied into a new draft, "+c.number+".")};
}
function cleanInvoice(d){
  const c=calc(d,state.settings);
  const o={number:d.number,status:d.status||"draft",issueDate:d.issueDate,dueDate:d.dueDate,clientId:d.clientId||"",
    client:{name:(d.client.name||"").trim(),business:(d.client.business||"").trim(),abn:(d.client.abn||"").trim(),email:(d.client.email||"").trim()},
    event:d.event||"",eventDate:d.eventDate||"",items:c.lines.map(i=>({desc:i.desc||"",qty:+i.qty||0,price:+i.price||0})),
    gstMode:d.gstMode||"incl",deposit:+d.deposit||0,note:d.note||"",paidAmount:+d.paidAmount||0,paidDate:d.paidDate||"",
    total:c.total,gst:c.gst,updatedAt:new Date().toISOString()};
  if(d.createdAt)o.createdAt=d.createdAt;else o.createdAt=o.updatedAt;
  if(state.me){o.updatedBy=state.me;o.createdBy=d.createdBy||state.me}else if(d.createdBy)o.createdBy=d.createdBy;
  if(d.paidBy)o.paidBy=d.paidBy;
  if(d.remindedAt){o.remindedAt=d.remindedAt;o.remindCount=+d.remindCount||1}
  if(d.sentDate)o.sentDate=d.sentDate;
  return o;
}
async function saveDraft(announce,markSent){
  if(!state.db||!state.canWrite)return false;
  const d=state.draft;
  if(!(d.client.name||"").trim()){toast("Add the client's name first.");document.getElementById("cName")?.focus();return false}
  try{
    if(d._new){ // never overwrite another invoice with the same number
      const ex=await state.db.doc("invoices/"+d.number).get();
      if(ex.exists){d.number=nextNumber();if(state.invoices.some(i=>i.number===d.number)){toast("That number is taken. Try again.");return false}}
    }
    if(markSent&&d.status==="draft"){d.status="sent";d.sentDate=todayISO()}
    if(!d.clientId&&document.getElementById("saveClient")?.checked&&d.client.name.trim()){
      const ref=state.db.collection("clients").doc();
      await ref.set({name:d.client.name.trim(),business:d.client.business||"",abn:d.client.abn||"",email:d.client.email||"",mode:d.gstMode||"incl",createdAt:new Date().toISOString()});
      d.clientId=ref.id;
    }
    await state.db.doc("invoices/"+d.number).set(cleanInvoice(d));
    d._new=false;d._saved=true;state.dirty=false;
    if(announce)toast("Saved "+d.number+".");
    if(state.view==="new")renderEditor();
    return true;
  }catch(e){handleWriteError(e);return false}
}
async function downloadInvoice(inv,btn,fromEditor){
  if(!inv)return;
  if(!window.jspdf){toast("The PDF maker didn't load. Check your connection and reload.");return}
  if(!state.dl){toast("Downloads aren't available in this browser.");return}
  const old=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Preparing..."}
  try{
    if(fromEditor&&state.db&&state.canWrite){const ok=await saveDraft(false,true);if(!ok)return}
    const blob=buildPdf(fromEditor?state.draft:inv);
    const name=(fromEditor?state.draft.number:inv.number)+".pdf";
    await state.dl.save({filename:name,data:blob});
    toast(name+" saved. Email it to your client.");
  }catch(e){
    const code=e&&e.code;
    if(code==="declined")toast("Download cancelled.");
    else if(code==="rate_limited")toast("A download is already waiting for you to confirm.");
    else toast("The PDF couldn't be made. Try again.");
  }finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
function handleWriteError(e){
  const code=e&&e.code;
  if(code==="invalid_argument"&&state.canWrite!==false){state.canWrite=false;render();toast("Your login can't save changes. Sign out and back in.")}
  else if(code==="quota_exceeded")toast("Storage is full. Delete old drafts to make room.");
  else toast("Couldn't save just now. Try again in a moment.");
}

        <span class="muted" style="font-size:12px">These appear as one-tap buttons when you add items to an invoice.</span>
        <div class="plist">${(b.priceList||[]).map((p,i)=>`<div class="prow"><input type="text" id="pn${i}" data-p="${i}" data-pk="name" value="${esc(p.name)}" aria-label="Name"><input type="number" id="pp${i}" data-p="${i}" data-pk="price" value="${esc(p.price)}" step="0.01" aria-label="Price">
          <select id="pm${i}" data-p="${i}" data-pk="mode" aria-label="Price type"><option value="incl" ${p.mode!=="excl"?"selected":""}>incl. GST</option><option value="excl" ${p.mode==="excl"?"selected":""}>+ GST</option></select>
          <button class="x btn ghost sm" type="button" data-pdel="${i}" aria-label="Remove">&times;</button></div>`).join("")||`<p class="muted">No shortcuts yet.</p>`}</div></div>
      <div class="card"><h2>Tax Reserve estimate</h2><div class="grid2">${f("taxRate","Tax rate on profit (0.32 = 32%)","number",'step="0.01" min="0" max="0.6"')}${f("costPct","Costs as share of income (0.11 = 11%)","number",'step="0.01" min="0" max="0.9"')}</div>
        <span class="muted" style="font-size:12px">Used for the "move to Tax Reserve" figure when you mark an invoice paid. 32% suits wages between $45,001 and $135,000. Your accountant can confirm.</span></div>
      <div class="card"><h2>Password</h2>
        <span class="muted" style="font-size:12px">You both sign in with ${esc(userShim._email||LOGIN_EMAIL)} and the same password. Use at least 10 characters. After a change, sign in again on your other phones and laptops.</span>
        <div class="grid2"><div class="field"><label for="pw1">New password</label><input type="password" id="pw1" autocomplete="new-password"></div><div class="field"><label for="pw2">Type it again</label><input type="password" id="pw2" autocomplete="new-password"></div></div>
        <div><button class="btn sm" type="button" id="pwSave">Change password</button></div></div>
    </div></div></section>`;
  const pw=$("#pwSave");if(pw)pw.onclick=async()=>{const a=$("#pw1").value,b2=$("#pw2").value;
    if(a.length<10){toast("Use at least 10 characters.");return}if(a!==b2){toast("The two passwords don't match.");return}
    pw.disabled=true;const {error}=await supa.auth.updateUser({password:a});pw.disabled=false;
    if(error){toast((error.message||"").toLowerCase().includes("same")?"That's already the password.":"Couldn't change it just now. Try again.");return}
    $("#pw1").value="";$("#pw2").value="";toast("Password changed.")};
  document.querySelectorAll("[data-b]").forEach(el=>el.oninput=()=>{const k=el.dataset.b;b[k]=["termsDays","taxRate","costPct"].includes(k)?+el.value:el.value});
  $("#b_gstRegistered").onchange=e=>b.gstRegistered=e.target.checked;
  document.querySelectorAll("[data-p]").forEach(el=>el.oninput=el.onchange=()=>{const p=b.priceList[+el.dataset.p];const k=el.dataset.pk;p[k]=k==="price"?+el.value:el.value;if(k==="name")p.desc=p.desc&&p.desc!==p.name?p.desc:el.value});
  document.querySelectorAll("[data-pdel]").forEach(x=>x.onclick=()=>{b.priceList.splice(+x.dataset.pdel,1);renderBusiness()});
  const ap=$("#addP");if(ap)ap.onclick=()=>{(b.priceList=b.priceList||[]).push({name:"New item",price:0,mode:"incl"});renderBusiness()};
  const sb=$("#saveBiz");if(sb)sb.onclick=async()=>{try{await state.db.doc("settings/business").set({...b,updatedAt:new Date().toISOString()});bizDraft=null;toast("Business details saved.")}catch(e){handleWriteError(e)}};
}

/* ---------- toast ---------- */
function who(id){if(!id)return"";if(id===state.me)return"you";const n=(state.names[id]||"").trim();return n?n.split(/\s+/)[0]:"your partner"}
async function loadNames(){if(!state.user||!state.user.profiles)return;const ids=[...new Set(state.invoices.flatMap(i=>[i.createdBy,i.updatedBy,i.paidBy]).filter(x=>x&&!(x in state.names)))];if(!ids.length)return;
  try{const ps=await state.user.profiles(ids);let ch=false;ids.forEach(id=>{const n=(ps&&ps[id]&&ps[id].name)||"";state.names[id]=n;ch=true});if(ch&&(state.view!=="new"||!state.dirty))render()}catch(e){}}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600)}

/* ---------- boot ---------- */
addEventListener("hashchange",()=>{if(!booted)return;const v=(location.hash||"#invoices").slice(1);if(v==="new"&&state.view!=="new")newDraft();setView(v)});
addEventListener("beforeunload",e=>{if(state.dirty&&state.view==="new"){e.preventDefault();e.returnValue=""}});
let booted=false;
const LOGIN_EMAIL="kathavisualscbr@gmail.com";
const PEOPLE=["Yaman","Prakash"];
function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function okMsg(t){return `<div class="banner" style="background:var(--good-bg);color:var(--good)">${t}</div>`}
function badMsg(t){return `<div class="banner bad">${esc(t)}</div>`}
function renderLogin(msg){
  document.body.classList.add("signed-out");bar("");$("#notice").innerHTML="";
  $("#app").innerHTML=`<section class="view"><div class="card login-card"><h1>Sign in</h1>
    <form id="loginForm"><div class="field"><label for="lEmail">Email</label><input type="email" id="lEmail" required autocomplete="username" inputmode="email" value="${esc(LOGIN_EMAIL)}"></div>
    <div class="field"><label for="lPass">Password</label><input type="password" id="lPass" required autocomplete="current-password"></div>
    <button class="btn primary" type="submit" id="lBtn">Sign in</button></form><div id="lMsg">${msg||""}</div>
    <span class="muted" style="font-size:12px">Forgot the password? Yaman can set a new one.</span></div></section>`;
  if(!$("#lPass").value)$("#lPass").focus();
  $("#loginForm").onsubmit=async e=>{e.preventDefault();const email=$("#lEmail").value.trim().toLowerCase(),password=$("#lPass").value;const b=$("#lBtn");b.disabled=true;b.textContent="Signing in...";
    const {data,error}=await supa.auth.signInWithPassword({email,password});
    b.disabled=false;b.textContent="Sign in";
    if(!error&&data&&data.session){boot(data.session);return}
    const m=((error&&error.message)||"").toLowerCase();
    $("#lMsg").innerHTML=badMsg(m.includes("invalid")?"That email and password don't match. Check the password and try again.":m.includes("rate")||(error&&error.status===429)?"Too many tries. Wait a few minutes, then try again.":"Couldn't sign in just now. Check your connection and try again.")}
}
function renderSetup(token){
  document.body.classList.add("signed-out");bar("");$("#notice").innerHTML="";
  $("#app").innerHTML=`<section class="view"><div class="card login-card"><h1>Set the password</h1>
    <p class="muted" style="margin:0">This is the one password you and Prakash will both use with ${esc(LOGIN_EMAIL)}. Use at least 10 characters. This link works once.</p>
    <form id="setupForm"><div class="field"><label for="sPass">New password</label><input type="password" id="sPass" required minlength="10" autocomplete="new-password"></div>
    <div class="field"><label for="sPass2">Type it again</label><input type="password" id="sPass2" required minlength="10" autocomplete="new-password"></div>
    <button class="btn primary" type="submit" id="sBtn">Save password and sign in</button></form><div id="sMsg"></div></div></section>`;
  $("#sPass").focus();
  $("#setupForm").onsubmit=async e=>{e.preventDefault();const a=$("#sPass").value,b2=$("#sPass2").value;
    if(a.length<10){$("#sMsg").innerHTML=badMsg("Use at least 10 characters.");return}
    if(a!==b2){$("#sMsg").innerHTML=badMsg("The two passwords don't match.");return}
    const btn=$("#sBtn");btn.disabled=true;btn.textContent="Saving...";
    const {data,error}=await supa.rpc("set_password_with_link",{p_token:token,p_password:a});
    btn.disabled=false;btn.textContent="Save password and sign in";
    const r=error?"error":data;
    if(r!=="ok"){$("#sMsg").innerHTML=badMsg({used:"This link has already been used. Sign in with the password instead.",expired:"This link has expired. Ask for a new one.",invalid:"This link isn't valid. Check you copied all of it.",too_short:"Use at least 10 characters."}[r]||"Couldn't save the password just now. Try again.");return}
    history.replaceState(null,"",location.pathname);
    const s=await supa.auth.signInWithPassword({email:LOGIN_EMAIL,password:a});
    if(s.data&&s.data.session)boot(s.data.session);else renderLogin(okMsg("Password saved. Sign in with it now."))}
}
function pickPerson(){return new Promise(res=>{
  $("#app").innerHTML=`<section class="view"><div class="card login-card"><h1>Who's using this device?</h1>
    <p class="muted" style="margin:0">So invoices show who made them. You can switch any time from the top of the page.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${PEOPLE.map(p=>`<button class="btn primary" type="button" data-person="${p}" style="flex:1">${p}</button>`).join("")}</div></div></section>`;
  document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{lsSet("katha_me",b.dataset.person);res(b.dataset.person)})})}
function renderWho(){
  $("#who").innerHTML=`<span>${esc(state.me)} on this device</span><button class="btn sm ghost" type="button" id="switchMe">Switch to ${esc(PEOPLE.find(p=>p!==state.me)||"")}</button><button class="btn sm ghost" type="button" id="signOut">Sign out</button>`;
  $("#switchMe").onclick=()=>{state.me=PEOPLE.find(p=>p!==state.me);lsSet("katha_me",state.me);renderWho();render();toast("Now working as "+state.me+".")};
  $("#signOut").onclick=async()=>{if(state.dirty&&!confirmLeave())return;await supa.auth.signOut();location.hash="";location.reload()};
}
async function boot(session){
  if(booted)return;booted=true;
  const email=(session.user.email||"").toLowerCase();
  userShim._email=email;state.db=db;state.user=userShim;state.dl=dlShim;
  await loadMembers();
  if(!MEMBERS.some(m=>m.email===email)){booted=false;await supa.auth.signOut();renderLogin(badMsg(email+" can't open Katha Invoices."));return}
  PEOPLE.forEach(p=>state.names[p]=p);
  let me=lsGet("katha_me");if(!PEOPLE.includes(me))me=await pickPerson();
  state.me=me;
  document.body.classList.remove("signed-out");
  renderWho();
  const v=(location.hash||"#invoices").slice(1);
  newDraft();setView(["invoices","new","clients","business"].includes(v)?v:"invoices");
  const timer=setTimeout(()=>{state.timedOut=true;renderNotice()},10000);
  const done=()=>{if(state.loaded.settings&&state.loaded.invoices&&state.loaded.clients){clearTimeout(timer);state.timedOut=false}};
  db.doc("settings/business").onSnapshot(s=>{state.settings={...DEFAULTS,...(s.exists?s.data():{})};
    if(!s.metadata.fromCache)state.loaded.settings=true;done();
    if(state.draft&&state.draft._new&&!state.dirty){newDraft()}
    if(state.view!=="new"||!state.dirty)render();},e=>{state.loaded.settings=true;render()});
  db.collection("clients").onSnapshot(s=>{state.clients=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)state.loaded.clients=true;done();
    if(state.view==="clients"||(state.view==="new"&&!state.dirty))render();},e=>{state.loaded.clients=true});
  db.collection("invoices").onSnapshot(s=>{state.invoices=s.docs.map(d=>({...d.data(),number:d.data().number||d.id}));if(!s.metadata.fromCache)state.loaded.invoices=true;done();
    if(state.draft&&state.draft._new&&!state.dirty)state.draft.number=nextNumber();
    if(state.view!=="new"||!state.dirty)render();},e=>{state.loaded.invoices=true;render()});
  startLive();
}
function confirmLeave(){return window.confirm("You have unsaved changes on this invoice. Sign out anyway?")}
(async function start(){
  supa.auth.onAuthStateChange((ev,s)=>{if(/^#setup=/.test(location.hash))return;if(s&&!booted&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))boot(s)});
  const setup=(location.hash.match(/^#setup=([A-Za-z0-9_-]{20,})$/)||[])[1];
  if(setup){renderSetup(setup);return}
  const {data}=await supa.auth.getSession();
  if(data&&data.session)boot(data.session);else if(!booted)renderLogin();
})();
</script>
</body>
</html>
